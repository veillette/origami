name: Publish to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/site-ci.yml
    with:
      output: dist
      node-version-file: .nvmrc
      check: npm test
      build: npm run build
